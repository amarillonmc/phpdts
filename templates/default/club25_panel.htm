<div class="section-container">
    <h4 class="section-title">可怜猫的小礼物</h4>
    <div class="section-content">
        <p class="purple">别急着走呀。礼物还没拿呢。</p>
        <label>处理物品
            <select id="c25-target">
                <!--{if !empty($pdata['weps'])}-->
                <option value="wep">当前武器：<!--{echo htmlspecialchars($pdata['wep'],ENT_QUOTES,'UTF-8');}--></option>
                <!--{/if}-->
                <!--{loop Array(0,1,2,3,4,5,6) $c25slot}-->
                <!--{if !empty($pdata['itms'.$c25slot])}-->
                <option value="{$c25slot}"><!--{if !$c25slot}-->刚发现<!--{else}-->背包{$c25slot}<!--{/if}-->：<!--{echo htmlspecialchars($pdata['itm'.$c25slot],ENT_QUOTES,'UTF-8');}--></option>
                <!--{/if}-->
                <!--{/loop}-->
            </select>
        </label><br>
        <label>数量 <select id="c25-count"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
        <label>诡雷 <select id="c25-kind"><option value="damage">咬一口</option><option value="poison">使其中毒</option></select></label><br>
        <input type="button" value="改装并埋雷" onclick="club25Cmd('modify');">
        <input type="button" value="捉迷藏" onclick="club25Cmd('hide');">
        <input type="button" value="装诡雷" onclick="club25Cmd('trip');"><br>
        <input type="button" value="布场" onclick="club25Cmd('deploy');">
        <input type="button" value="藏并投放" onclick="club25Cmd('hide_deploy');">
        <input type="button" value="诡雷并投放" onclick="club25Cmd('trip_deploy');">
        <input type="button" value="投喂（{$c25cfg['feed_rage']}怒）" onclick="club25Cmd('feed');">
        <p class="grey">改装直接埋下一枚雷。捉迷藏与诡雷加工后仍留在原处，可以叠加，再布场投放。数量用于批量埋设现有普通雷。</p>
        <p><!--{if !empty($clbpara['c25_catstep'])}--><span class="lime">猫步：下一次成功移动不遇敌、不踩雷。</span><!--{/if}--></p>
    </div>
</div>
<div class="section-container">
    <h4 class="section-title">布场一览 <input type="button" value="刷新" onclick="club25Cmd('board');"></h4>
    <div class="section-content">
        <p class="grey">记录自己留在地面的布置，也显示当地可借用的机关。被拿走后不再追踪。</p>
        <!--{if empty($c25_rows)}-->
        <p>还没有摆好的礼物。先给世界一点小小的惊喜吧。</p>
        <!--{else}-->
        <table style="width:100%;table-layout:fixed;word-break:break-all;">
            <tr><th>地点／归属</th><th>物品</th><th>效果／数量</th><th>操作</th></tr>
            <!--{loop $c25_rows $c25row}-->
            <tr>
                <td><!--{echo htmlspecialchars($c25row['place'],ENT_QUOTES,'UTF-8');}--><br><!--{if $c25row['owned']}-->自己的<!--{else}-->借来的<!--{/if}--></td>
                <td><!--{echo htmlspecialchars($c25row['name'],ENT_QUOTES,'UTF-8');}--><br><span class="grey"><!--{echo htmlspecialchars($c25row['kind'],ENT_QUOTES,'UTF-8');}--></span></td>
                <td><!--{echo (int)$c25row['effect'];}-->／<!--{echo htmlspecialchars((string)$c25row['count'],ENT_QUOTES,'UTF-8');}--></td>
                <td>
                    <!--{if $c25row['local'] && $c25row['owned']}-->
                    <input type="button" value="撤回" data-c25-key="<!--{echo htmlspecialchars($c25row['key'],ENT_QUOTES,'UTF-8');}-->" onclick="club25Cmd('withdraw',this.getAttribute('data-c25-key'));">
                    <!--{/if}-->
                    <!--{if $c25row['can_net'] && !empty($bid) && in_array($action,Array('enemy','chase','pchase','dfight'))}-->
                    <input type="button" value="收网" data-c25-key="<!--{echo htmlspecialchars($c25row['key'],ENT_QUOTES,'UTF-8');}-->" onclick="club25Net(this.getAttribute('data-c25-key'));">
                    <!--{/if}-->
                </td>
            </tr>
            <!--{/loop}-->
        </table>
        <!--{/if}-->
        <p class="grey">收网在遭遇对手时使用，会消耗现场机关并承担对方反击；补给只能诱使NPC食用。</p>
    </div>
</div>
<!--{/if}-->
